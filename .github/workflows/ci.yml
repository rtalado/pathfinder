name: Controle

# Loopt bij elke push: typecontrole, build, een controle op de leerpaden zelf
# (verwijzen alle nodes naar bestaande bestanden en documenten?), en een
# syntaxcontrole op de terminalversie, die geen typecontrole heeft.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Leerpaden controleren
        run: node scripts/check-content.mjs

      - name: Typecontrole en build
        run: npm run build

      # De terminalversie is gewoon JavaScript; dit vangt in elk geval de tikfouten.
      - name: Terminalversie controleren
        run: node --check tui/index.mjs && for file in tui/*.mjs; do node --check "$file"; done

      # Beide schermen lezen hetzelfde palet; een kapot bestand sloopt ze allebei.
      - name: Thema's controleren
        run: node scripts/check-themes.mjs

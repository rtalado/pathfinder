name: Release

# Een release maak je door een versietag te pushen:
#   npm version patch && git push --follow-tags
#
# Deze workflow bouwt daarna de Windows-installer, de Linux-pakketten en de
# Android-APK, en hangt ze aan een GitHub Release. De apps controleren zelf op nieuwe releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: App bouwen
        run: npm run build

      - name: Installer bouwen en publiceren
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux-pakketten
    runs-on: ubuntu-latest
    # Na Windows, niet ernaast: allebei laten publiceren met electron-builder
    # betekent dat ze allebei dezelfde release proberen aan te maken.
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: App bouwen
        run: npm run build

      # De AppImage draait op elke distributie en werkt zichzelf bij; de .deb is
      # voor wie liever via zijn pakketbeheerder installeert.
      - name: AppImage en deb bouwen en publiceren
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    # Op jobniveau, want de secrets-context is niet beschikbaar in een step-if.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: App bouwen
        run: npm run build

      # Het Android-project staat niet altijd in de repository; Capacitor maakt het
      # opnieuw aan uit capacitor.config.ts.
      - name: Android-platform toevoegen als het ontbreekt
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Versie en ondertekening in het Android-project zetten
        run: node scripts/set-android-version.mjs

      - name: Webassets naar Android kopiëren
        run: npx cap sync android

      # De ondertekeningssleutel staat als base64 in de repository-secrets.
      # Ontbreekt hij, dan valt de build terug op de debug-sleutel; die APK is
      # installeerbaar maar kan later niet als update over een getekende versie heen.
      - name: Sleutel klaarzetten
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: APK bouwen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK hernoemen
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk "release/Pathfinder-${GITHUB_REF_NAME#v}.apk"

      - name: Aan de release toevoegen
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
